<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
    <script
      src="https://kit.fontawesome.com/616ad5bc36.js"
      crossorigin="anonymous"
    ></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap');
    </style>
  </head>
  <body>
    <secion id="landing">
      <div class="navbar">
        <figure class="nav__img">
          <img id="nav__logo" src="./assets/blinker-icon.4f9b2663.png" alt="" />
        </figure>
        <ul class="nav__links">
          <li class="nav__link ">
            <a href="#" 
            class="nav__link--anchor">
            <span class="purple">Home</span></li>
            </a>
          <li class="nav__link ">
             <a href="browse.html" 
            class="nav__link--anchor">
            <span class="purple">Find Your Vehicle</span></li>
            </li>
           </a>
          <button class="nav__btn btn">CONTACT</button>
        </ul>
      </div>
    </secion>
    <section id="header">
      <div class="container">
          <div class="row">
            <h1 class="header__title">
              <span class="purple"
                >Kentucky's most awarded car subscription platform
              </span>
            </h1>
            <h2 class="header__subtitle">
              FIND YOUR DREAM CAR WITH <span class="purple">BLINKER</span>
            </h2>
            <div class="search__wrapper">
              <input
                type="search"
                class="input search__browser--input"
                placeholder="Search by Model, Make or Keyword"
              />
              <button type="submit" class="search__btn btn">
                <i class="fa-solid fa-magnifying-glass"></i>
              </button>
            </div>
          </div>
          <figure class="landing__img">
            <img src="./assets/building.681ea6bf.png" />
          </figure>
      </div>
    </section>
  </body>
</html>
